name: Auto post ads

on:
  schedule:
    # Times are UTC. Kurdistan/Iraq = UTC+3 -> 13:07, 18:07, 21:07 local time
    - cron: "7 10 * * *"
    - cron: "7 15 * * *"
    - cron: "7 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only make the video, do not post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libfribidi0 > /dev/null
          pip install -q -r requirements.txt

      - name: Make video and post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          VIDEO_MODE: ${{ vars.VIDEO_MODE }}
          AD_LANGUAGE: ${{ vars.AD_LANGUAGE }}
          SHOP_NAME: ${{ vars.SHOP_NAME }}
          SHOP_CONTACT: ${{ vars.SHOP_CONTACT }}
          EXTRA_HASHTAGS: ${{ vars.EXTRA_HASHTAGS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python -m app.main

      - name: Keep the video (download it from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-video
          path: output/*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Save refreshed tokens
        if: always() && hashFiles('output/secrets_update.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::Add a GH_PAT secret so tokens refresh automatically"; exit 0; fi
          while IFS='=' read -r name value; do
            printf '%s' "$value" | gh secret set "$name" --repo "$GITHUB_REPOSITORY"
          done < output/secrets_update.txt

      - name: Move posted photo to done/
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "autopost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A inbox done
          git diff --cached --quiet || (git commit -m "Posted ad" && git push)
